<!-- SPINNER DE CARREGAMENTO (COMPONENTE REUTILIZÁVEL) -->
<div style="text-align: center; padding: 60px 20px;">
    <div class="dot-spinner">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>
    <p style="margin-top: 25px; color: #666; font-size: 14px;">{{ mensagem or 'Carregando...' }}</p>
</div>

<style>
    /* ===== SPINNER DE BOLINHAS ===== */
    .dot-spinner {
        display: flex;
        justify-content: center;
        gap: 12px;
    }

    .dot {
        width: 8px;
        height: 8px;
        background: #184145;
        border-radius: 50%;
        animation: bounce 1.4s ease-in-out infinite;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    .dot:nth-child(3) { animation-delay: 0s; }

    @keyframes bounce {
        0%, 80%, 100% {
            transform: scale(0.8);
            opacity: 0.5;
        }
        40% {
            transform: scale(1.2);
            opacity: 1;
        }
    }
</style>
