<!-- ============================================================ -->
<!-- COMPONENTE: BOTÕES DE AÇÃO PADRONIZADOS                      -->
<!-- ============================================================ -->
<!--                                                              -->
<!-- COMO USAR:                                                   -->
<!--   Copie o botão desejado e troque apenas o onclick           -->
<!--                                                              -->
<!-- CLASSES DISPONÍVEIS:                                         -->
<!--   .btn-action          → Base do botão                      -->
<!--   .btn-action-view     → Cor azul (visualizar)              -->
<!--   .btn-action-edit     → Cor amarela (editar)               -->
<!--   .btn-action-delete   → Cor vermelha (excluir)             -->
<!--   .btn-action-text     → Versão com texto                   -->
<!--   .btn-action-sm       → Tamanho pequeno                    -->
<!--   .btn-action-lg       → Tamanho grande                     -->
<!-- ============================================================ -->

<!-- VISUALIZAR - Ícone -->
<button class="btn-action btn-action-view" onclick="" title="Visualizar">
    <i class="fas fa-eye"></i>
</button>

<!-- VISUALIZAR - Com texto -->
<button class="btn-action btn-action-view btn-action-text" onclick="">
    <i class="fas fa-eye"></i> Visualizar
</button>

<!-- EDITAR - Ícone -->
<button class="btn-action btn-action-edit" onclick="" title="Editar">
    <i class="fas fa-pencil-alt"></i>
</button>

<!-- EDITAR - Com texto -->
<button class="btn-action btn-action-edit btn-action-text" onclick="">
    <i class="fas fa-pencil-alt"></i> Editar
</button>

<!-- EXCLUIR - Ícone -->
<button class="btn-action btn-action-delete" onclick="" title="Excluir">
    <i class="fas fa-trash-alt"></i>
</button>

<!-- EXCLUIR - Com texto -->
<button class="btn-action btn-action-delete btn-action-text" onclick="">
    <i class="fas fa-trash-alt"></i> Excluir
</button>

<!-- PEQUENO -->
<button class="btn-action btn-action-delete btn-action-sm" onclick="" title="Excluir">
    <i class="fas fa-trash-alt"></i>
</button>

<!-- GRANDE -->
<button class="btn-action btn-action-view btn-action-lg" onclick="" title="Visualizar">
    <i class="fas fa-eye"></i>
</button>
