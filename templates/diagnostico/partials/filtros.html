<!-- FILTROS -->
<div class="form-section filtros-section">
    <div class="form-row">
        <div class="form-group">
            <label for="filtro_area_select">
                <i class="fas fa-building"></i> Área:
            </label>
            <select id="filtro_area_select" class="form-control">
                <option value="">Selecione uma área...</option>
                {% for nome, id in areas.items() %}
                <option value="{{ id }}">{{ nome }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="filtro_auditoria_select">
                <i class="fas fa-clipboard-list"></i> Tema de Auditoria:
            </label>
            <select id="filtro_auditoria_select" class="form-control" disabled>
                <option value="">Selecione uma área primeiro...</option>
            </select>
        </div>
    </div>
</div>
