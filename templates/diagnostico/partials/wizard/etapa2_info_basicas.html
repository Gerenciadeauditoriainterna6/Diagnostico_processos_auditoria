<!-- PASSO 2: INFORMAÇÕES BÁSICAS -->
<div id="info-basicas-section" class="form-section" style="display: none;">
    <input type="hidden" id="id_area_selecionado" name="id_area_selecionado">
    <h3>2. Informações do Processo</h3>

    <div class="form-group">
        <label for="entrevistado_processo">
            <i class="fas fa-user"></i> Nome do Entrevistado
        </label>
        <input type="text" id="entrevistado_processo" class="form-control" 
            placeholder="Ex: João da Silva">
    </div>

    <!-- Botão Adicionar Processo -->
    <button type="button" id="btn-adicionar-processo" class="btn-outline" style="margin-bottom:15px;">
        <i class="fas fa-plus"></i> Adicionar Processo
    </button>

    <!-- Container dos Processos -->
    <div id="processos-executores-container" style="display: none;">
        <div class="section-title" style="margin-bottom:15px;">
            <i class="fas fa-tasks"></i> Processos
        </div>
        <div id="processos-executores-lista"></div>
    </div>

    <div class="wizard-buttons">
        <button type="button" class="btn-secondary" id="btn-voltar-etapa1">← Voltar</button>
        <button type="button" class="btn-primary" id="btn-proximo-etapa3" disabled>
            Próximo: Detalhar →
        </button>
    </div>
</div>
