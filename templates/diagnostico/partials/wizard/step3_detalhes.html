<!-- PASSO 3: INFORMAÇÕES DO PROCESSO (DETALHES)-->
<div id="detalhes-section" class="form-section" style="display: none;">
    <h3>3. Informações do Processo</h3>
    
    <div class="alert-info" style="margin-bottom: 20px; padding: 12px;">
        <i class="fas fa-info-circle"></i> Os campos abaixo são para as demais informações do processo.
    </div>

    <div class="detalhes-container">
        <div class="form-group">
            <label for="descricao_processo">
                <i class="fas fa-align-left"></i> O que é o processo?
                <span class="help-icon" data-tooltip="O que acontece aqui dentro no dia a dia? Exemplo (Processo de Contratação): É o conjunto de etapas que inclui a abertura da vaga, a triagem de currículos, as entrevistas e a coleta de documentos do candidato.">
                    <i class="fas fa-question-circle"></i>
                </span>
            </label>
            <textarea id="descricao_processo" name="descricao" class="form-control" 
                rows="3" placeholder="Descreva o que é o processo..."></textarea>
        </div>

        <div class="form-group">
            <label for="etapa_ini_processo">
                <i class="fas fa-play-circle"></i> Onde começa o processo?
                <span class="help-icon" data-tooltip="Ex: Do envio do relatório x pela área y – ETAPA INICIAL">
                    <i class="fas fa-question-circle"></i>
                </span>
            </label>
            <textarea id="etapa_ini_processo" name="etapa_ini" class="form-control" rows="2" placeholder="Etapa de..."></textarea>
        </div>

        <div class="form-group">
            <label for="produto_processo">
                <i class="fas fa-cube"></i> Qual(is) o(s) produto(s) final(is) desse processo?
                <span class="help-icon" data-tooltip="(Relatório, Planilha, Sistema, Word e etc) – PENÚLTIMA ETAPA ">
                    <i class="fas fa-question-circle"></i>
                </span>
            </label>
            <textarea id="produto_processo" name="produto" class="form-control" rows="2" placeholder="Ex: Relatório, Planilha, Sistema..."></textarea>
        </div>

        <div class="form-group">
            <label for="etapa_fim_processo">
                <i class="fas fa-stop-circle"></i> Depois de acabado, para onde envia?
                <span class="help-icon" data-tooltip="(Ex: Área x, Arquivo físico localizado no..., Arquivo digital localizado no...) ETAPA FINAL">
                    <i class="fas fa-question-circle"></i>
                </span>
            </label>
            <textarea id="etapa_fim_processo" name="etapa_fim" class="form-control" rows="2" placeholder="Ex: Enviado para..."></textarea>
        </div>

        <div class="form-group">
            <label for="objetivo_processo">
                <i class="fas fa-bullseye"></i> Qual o objetivo do processo? E por que faz?
                <span class="help-icon" data-tooltip="Exemplo (Objetivo da Contratação): Garantir que a empresa tenha o talento certo, na cadeira certa, no tempo necessário para não perder produtividade.">
                    <i class="fas fa-question-circle"></i>
                </span>
            </label>
            <textarea id="objetivo_processo" name="objetivo" class="form-control" 
                rows="2" placeholder="Garantir o que exatamente?"></textarea>
        </div>
    </div>

    <!-- Botões de navegação -->
    <div class="wizard-buttons">
        <button type="button" class="btn-secondary" id="btn-voltar-etapa2">
            ← Voltar para Informações Iniciais
        </button>
        <button type="button" class="btn-primary" id="btn-salvar-detalhes">
            Próximo: Riscos →
        </button>
    </div>
</div>
