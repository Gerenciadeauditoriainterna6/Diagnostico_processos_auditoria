<!-- PASSO 2: INFORMAÇÕES BÁSICAS (MÚLTIPLOS PROCESSOS) -->
<div id="info-basicas-section" class="form-section" style="display: none;">
    <input type="hidden" id="id_area_selecionado" name="id_area_selecionado">
    <h3>2. Informações do Processo</h3>

    <!-- Entrevistado (UM por wizard) -->
    <div class="form-group">
        <label for="entrevistado_processo">
            <i class="fas fa-user"></i> Nome do Entrevistado
            <span class="help-icon" data-tooltip="Nome da pessoa que foi entrevistada para o levantamento das informações do processo.">
                <i class="fas fa-question-circle"></i>
            </span>
        </label>
        <input type="text" id="entrevistado_processo" name="entrevistado" class="form-control" 
            placeholder="Ex: João da Silva">
    </div>

    <!-- FUNCIONÁRIOS DA ÁREA -->
    <div class="form-group executores-group">
        <label>
            <i class="fas fa-users"></i> Funcionários executores
            <span class="help-icon" data-tooltip="Selecione os funcionários e defina os processos que cada um executa.">
                <i class="fas fa-question-circle"></i>
            </span>
        </label>
        
        <div class="executores-container">
            <!-- Campo de busca -->
            <div class="search-wrapper">
                <input type="text" id="buscar-executor" 
                    placeholder="Filtrar funcionários por nome..."
                    class="form-control search-input" autocomplete="off">
            </div>
            
            <!-- Lista de funcionários disponíveis -->
            <div class="funcionarios-disponiveis">
                <div class="section-title">
                    <i class="fas fa-list"></i> Funcionários da Área
                    <span id="total-funcionarios" class="contador">0</span>
                </div>
                <div id="lista-funcionarios" class="funcionarios-grid">
                    <div class="loading-message">Carregando funcionários...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- PROCESSOS DOS FUNCIONÁRIOS SELECIONADOS -->
    <div id="processos-executores-container" style="display: none;">
        <div class="section-title" style="margin-top: 20px;">
            <i class="fas fa-tasks"></i> Processos por Funcionário
        </div>
        <div id="processos-executores-lista">
            <!-- Preenchido dinamicamente pelo JavaScript -->
        </div>
    </div>

    <!-- Botões de navegação -->
    <div class="wizard-buttons">
        <button type="button" class="btn-secondary" id="btn-voltar-etapa1">
            ← Voltar
        </button>
        <button type="button" class="btn-primary" id="btn-proximo-etapa3" disabled>
            Próximo: Salvar e Detalhar →
        </button>
    </div>
</div>
