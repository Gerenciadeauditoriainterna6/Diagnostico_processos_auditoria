<!-- PASSO 2: INFORMAÇÕES BÁSICAS (NOME + EXECUTORES) -->
<div id="info-basicas-section" class="form-section" style="display: none;">
    <input type="hidden" id="id_area_selecionado" name="id_area_selecionado">
    <h3>2. Informações do Processo</h3>

        <div class="form-group">
        <label for="entrevistado_processo">
            <i class="fas fa-user"></i> Nome do Entrevistado
            <span class="help-icon" data-tooltip="Nome da pessoa que foi entrevistada para o levantamento das informações do processo.">
                <i class="fas fa-question-circle"></i>
            </span>
        </label>
        <input type="text" id="entrevistado_processo" name="entrevistado" class="form-control" 
            placeholder="Ex: João da Silva">
    </div>
    
    <div class="form-group">
        <label for="nome_processo">
            <i class="fas fa-tag"></i> Nome do Processo *
            <span class="help-icon" data-tooltip="Atividade realizada pela área.">
                <i class="fas fa-question-circle"></i>
            </span>
        </label>
        <input type="text" id="nome_processo" name="nome_processo" class="form-control" required 
            placeholder="Ex: Processo de Fechamento Financeiro">
    </div>

    <div class="form-group">
        <label for="codigo_processo"><i class="fas fa-barcode"></i> Código do Processo</label>
        <input type="text" id="codigo_processo" name="codigo_processo" class="form-control" disabled 
            placeholder="Código gerado automaticamente">
    </div>

    <!-- SEÇÃO DE EXECUTORES -->
    <div class="form-group executores-group">
        <label>
            <i class="fas fa-users"></i> Quem executa o processo? *
            <span class="help-icon" data-tooltip="Selecione os funcionários que executam este processo.">
                <i class="fas fa-question-circle"></i>
            </span>
        </label>
        
        <div class="executores-container">
            <!-- Campo de busca para filtrar -->
            <div class="search-wrapper">
                <input type="text" 
                    id="buscar-executor" 
                    placeholder="Filtrar funcionários por nome..."
                    class="form-control search-input"
                    autocomplete="off">
            </div>
            
            <!-- Lista de funcionários disponíveis (cards) -->
            <div class="funcionarios-disponiveis">
                <div class="section-title">
                    <i class="fas fa-list"></i> Funcionários da Área
                    <span id="total-funcionarios" class="contador">0</span>
                </div>
                <div id="lista-funcionarios" class="funcionarios-grid">
                    <div class="loading-message">Carregando funcionários...</div>
                </div>
            </div>
            
            <!-- Área dos selecionados -->
            <div class="executores-selecionados-area">
                <div class="section-title">
                    <i class="fas fa-check-circle"></i> Selecionados
                    <span id="contador-executores" class="contador">0</span>
                </div>
                <div id="executores-selecionados" class="selected-badges-container">
                    <div class="empty-message"><i class="fas fa-ban" style="color:#0b5b99";></i> Nenhum executor selecionado</div>
                </div>
            </div>
            
            <input type="hidden" id="executores_ids" name="executores_ids">
        </div>
        
        <small class="text-muted">
            <i class="fas fa-info-circle"></i> 
            Clique em "Adicionar" para selecionar os funcionários que executam este processo.
        </small>
    </div>

    <!-- Botões de navegação -->
    <div class="wizard-buttons">
        <button type="button" class="btn-secondary" id="btn-voltar-etapa1">
            ← Voltar
        </button>
        <button type="button" class="btn-primary" id="btn-proximo-etapa3" disabled>
            Próximo: Informações Básicas do Processo →
        </button>
    </div>
</div>
