<!--MODAL DE VISUALIZAÇÃO COMPLETO DO PROCESSO-->
<div id="modal-visualizar-processo" class="modal" style="display: none;">
    <div class="modal-content modal-visualizar-processo-content">
        <div class="modal-header">
            <h3><i class="fas fa-eye"></i> Visualizar Processo</h3>
            <button type="button" class="modal-close" id="btn-fechar-visualizar-processo">&times;</button>
        </div>
        <div class="modal-body" style="max-height: 70vh; overflow-y: auto;">
            <div id="visualizar-processo-conteudo">
                <div style="text-align: center; padding: 40px;">
                    <i class="fas fa-spinner fa-spin"></i> Carregando...
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" id="btn-fechar-visualizar-processo-footer">Fechar</button>
        </div>
    </div>
</div>
