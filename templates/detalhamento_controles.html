{% extends "base.html" %}

{% block title %}Controles das Etapas - Auditoria Interna{% endblock %}

{% block content %}

<div class="controles-container">
    <div class="page-header">
        <h1><i class="fas fa-shield-alt"></i> Controles das Etapas</h1>
        <p>Cadastre e gerencie os controles das etapas dos processos</p>
    </div>

    <!-- FILTROS -->
    <div class="form-section filtros-section">
        <div class="form-row">
            <div class="form-group">
                <label for="filtro_area_select"><i class="fas fa-building"></i> Área:</label>
                <select id="filtro_area_select" class="form-control">
                    <option value="">Selecione uma área...</option>
                    {% for nome, id in areas.items() %}
                    <option value="{{ id }}">{{ nome }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="filtro_auditoria_select"><i class="fas fa-clipboard-list"></i> Auditoria:</label>
                <select id="filtro_auditoria_select" class="form-control" disabled>
                    <option value="">Selecione uma área primeiro...</option>
                </select>
            </div>
        </div>
    </div>

    <!-- ÁREA PARA AS ETAPAS (será preenchida via JavaScript) -->
    <div id="etapas-container" class="etapas-container">
        <div class="alert-info" style="text-align: center; padding: 40px;">
            <i class="fas fa-info-circle"></i> Selecione uma área e auditoria para visualizar as etapas.
        </div>
    </div>
</div>

<!-- MODAL PARA ADICIONAR/EDITAR CONTROLE -->
<div id="modal-controle" class="modal" style="display: none;">
    <div class="modal-content" style="max-width: 700px; max-height: 90vh; overflow-y: auto;">
        <div class="modal-header">
            <h3 id="modal-controle-title">
                <i class="fas fa-shield-alt"></i> Novo Controle
            </h3>
            <button type="button" class="modal-close" id="btn-fechar-modal-controle">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="controle_id">
            <input type="hidden" id="controle_risco_id">
            
            <!-- Nome do Controle (obrigatório) -->
            <div class="form-group">
                <label><i class="fas fa-tag"></i> Nome do Controle *</label>
                <input type="text" id="controle_nome" class="form-control" placeholder="Ex: Revisão semanal dos dados">
            </div>

            <!-- Como é executado -->
            <div class="form-group">
                <label><i class="fas fa-cogs"></i> Como é executado?</label>
                <textarea id="controle_como_executado" class="form-control" rows="2" placeholder="Descreva como o controle é executado..."></textarea>
            </div>

            <!-- Objetivo do Controle -->
            <div class="form-group">
                <label><i class="fas fa-bullseye"></i> Objetivo do Controle</label>
                <textarea id="controle_objetivo" class="form-control" rows="2" placeholder="Qual o objetivo deste controle?"></textarea>
            </div>

            <!-- Periodicidade e Natureza (lado a lado) -->
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-calendar-alt"></i> Periodicidade</label>
                    <select id="controle_periodicidade" class="form-control">
                        <option value="">Selecione...</option>
                        <option value="Diário">Diário</option>
                        <option value="Semanal">Semanal</option>
                        <option value="Mensal">Mensal</option>
                        <option value="Trimestral">Trimestral</option>
                        <option value="Semestral">Semestral</option>
                        <option value="Anual">Anual</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-chart-line"></i> Natureza</label>
                    <select id="controle_natureza" class="form-control">
                        <option value="">Selecione...</option>
                        <option value="Preventivo">Preventivo</option>
                        <option value="Detectivo">Detectivo</option>
                        <option value="Corretivo">Corretivo</option>
                    </select>
                </div>
            </div>

            <!-- Forma de Execução e Status (lado a lado) -->
            <div class="form-row">
                <div class="form-group">
                    <label><i class="fas fa-play-circle"></i> Forma de Execução</label>
                    <select id="controle_forma_execucao" class="form-control">
                        <option value="">Selecione...</option>
                        <option value="Manual">Manual</option>
                        <option value="Automático">Automático</option>
                        <option value="Semiautomático">Semiautomático</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-circle"></i> Status</label>
                    <select id="controle_status" class="form-control">
                        <option value="">Selecione...</option>
                        <option value="Ativo">Ativo</option>
                        <option value="Inativo">Inativo</option>
                        <option value="Em implantação">Em implantação</option>
                    </select>
                </div>
            </div>

            <!-- Evidência de Realização -->
            <div class="form-group">
                <label><i class="fas fa-file-alt"></i> Evidência de Realização</label>
                <textarea id="controle_evidencia" class="form-control" rows="2" placeholder="Qual a evidência de que o controle foi executado?"></textarea>
            </div>

            <!-- Frequência da evidência -->
             <div class="form-group">
                <label><i class="fas fa-calendar-check"></i> Frequência da Evidência</label>
                <select id="controle_frequencia_evidencia" class="form-control">
                    <option value="">Selecione...</option>
                    <option value="Diário">Diário</option>
                    <option value="Semanal">Semanal</option>
                    <option value="Mensal">Mensal</option>
                    <option value="Trimestral">Trimestral</option>
                </select>
            </div>

            <!-- Responsáveis pelo Tratamento -->
            <div class="form-group">
                <label><i class="fas fa-users"></i> Responsáveis pelo Tratamento</label>
                <input type="text" id="controle_responsaveis" class="form-control" placeholder="Nomes dos responsáveis (separados por vírgula)">
            </div>

            <!-- Avaliação do Risco e Causa/Motivo -->
            <div class="form-group">
                <label><i class="fas fa-chart-bar"></i> Avaliação do Risco</label>
                <textarea id="controle_risco_avaliacao" class="form-control" rows="2" placeholder="Avaliação do risco após o controle..."></textarea>
            </div>

            <div class="form-group">
                <label><i class="fas fa-search"></i> Causa/Motivo</label>
                <textarea id="controle_causa_motivo" class="form-control" rows="2" placeholder="Causa ou motivo do controle..."></textarea>
            </div>

        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" id="btn-cancelar-modal-controle">Cancelar</button>
            <button type="button" class="btn-primary" id="btn-salvar-modal-controle">Salvar Controle</button>
        </div>
    </div>
</div>

<script>

    // ====== VARIÁVEIS GLOBAIS PARA O MODAL DE CONTROLE ======
    let riscoIdAtual = null;      // Armazena o ID do risco que está recebendo o controle
    let controleIdEditando = null; // Para saber se estamos editando (null = novo)

    // ====== ELEMENTOS DO DOM ======
    const filtroAreaSelect = document.getElementById('filtro_area_select');
    const filtroAuditoriaSelect = document.getElementById('filtro_auditoria_select')
    const etapasContainer = document.getElementById('etapas-container');

    // ====== FUNÇÃO PARA ESCAPAR HTML (evita injeção de código malicioso) ======
    function escapeHtml(text) {
        if (!text) return '';
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // ====== CARREGAR AUDITORIAS POR ÁREA ======
    async function carregarAuditorias(areaId) {
        // Se não tem área selecionada, limpa o select de auditoria
        if (!areaId) {
            filtroAuditoriaSelect.innerHTML = '<option value="">Selecione uma área primeiro...</option>';
            filtroAuditoriaSelect.disabled = true;
            return;
        }

        // Mostra loading enquanto busca as auditorias
        filtroAuditoriaSelect.innerHTML = '<option value"">Carregando auditorias...</option>';
        filtroAuditoriaSelect.disabled = true;

        try {
            // Faz a requisição apra o backend
            const response = await fetch(`/api/auditorias-por-area?area_id=${areaId}`);
            const data = await response.json();

            // Se encontrou auditorias, popula o select
            if (data.auditorias && data.auditorias.length > 0) {
                filtroAuditoriaSelect.innerHTML = '<option value="">Selecione uma auditoria...</option>';

                data.auditorias.forEach(aud => {
                    const option = document.createElement('option');
                    option.value = aud.id;
                    option.textContent = `${aud.codigo_auditoria} - ${aud.titulo} (${aud.ano} ${aud.trimestre}º trim)`;
                    filtroAuditoriaSelect.appendChild(option);
                });

                filtroAuditoriaSelect.disabled = false;
            } else {
                // Nenhuma auditoria encontrada
                filtroAuditoriaSelect.innerHTML = '<option value="">Nenhuma auditoria encontrada para esta áreas.</option>';
                filtroAuditoriaSelect.disabled = true;
            }
        } catch (error) {
            console.error('Error o carregar auditorias:', error);
            filtroAuditoriaSelect.innerHTML = '<option value="">Erro ao carregar</option>';
            filtroAuditoriaSelect.disabled = true;
        }
    }

    // ====== EVENTO DE MUDANÇA DE ÁREA ======
    if (filtroAreaSelect) {
        filtroAreaSelect.addEventListener('change', () => {
            const areaId = filtroAreaSelect.value;
            carregarAuditorias(areaId);

            // Limpar container de etapas (para não mostrar dados antigos)
            etapasContainer.innerHTML = `
                <div class="alert-info" style="text-align: center; padding: 40px;">
                    <i class="fas fa-info-circle"></i> Selecione uma área e auditoria para visualizar as etapas.
                </div>
            `;
        });
    }

    // ====== EVENTO DE MUDANÇA DE AUDITORIA ======
    if (filtroAuditoriaSelect) {
        filtroAuditoriaSelect.addEventListener('change', async () => {
            const auditoriaId = filtroAuditoriaSelect.value;

            if (!auditoriaId) {
                etapasContainer.innerHTML = `
                    <div class="alert-info" style="text-align: center; padding: 40px;">
                        <i class="fas fa-info-circle"></i> Selecione uma área e auditoria para visualizar as etapas.
                    </div>
                `;
                return;
            }

            // Mostrar loading enquanto verifica premissão
            etapasContainer.innerHTML = `
                <div style="text-align: center; padding: 60px 20px;">
                    <div class="dot-spinner">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <p style="margin-top: 25px; color: #666; font-size: 14px;">Verificando permissão...</p>
                </div>
            `;

            try {
                // 1. Verificar se o usuário tem permissão
                const response = await fetch(`/api/auditoria/${auditoriaId}/responsavel`);
                const data = await response.json();

                if (data.autorizado) {
                    // 2. Usuário autorizado - carregar as etapas
                    console.log('✅ Usuário autorizado:', data.usuario);
                    await carregarEtapas(auditoriaId);
                } else {
                    // 3. Usuário NÃO autorizado
                    console.log('❌ Usuário NÃO autorizado:', data.usuario);
                    etapasContainer.innerHTML = `
                        <div class="alert-error" style="text-align: center; padding: 40px;">
                            <i class="fas fa-lock"></i> Você não tem permissão para visualizar etapas dos processos desta auditoria.
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Erro ao verificar permissão:', error);
                etapasContainer.innerHTML = `
                    <div class="alert-error" style="text-align: center; padding: 40px;">
                        <i class="fas fa-exclamation-triangle"></i> Erro ao verificar permissão. Tente novamente.
                    </div>
                `;
            }
        });
    }

    // ====== FUNÇÃO PARA CARREGAR ETAPAS (e depois riscos) ======
    async function carregarEtapas(auditoriaId) {
        console.log('📋 Carregando etapas para auditoria:', auditoriaId);

        // Mostrar loading
        etapasContainer.innerHTML = `
                <div style="text-align: center; padding: 60px 20px;">
                    <div class="dot-spinner">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                    <p style="margin-top: 25px; color: #666; font-size: 14px;">Carregando etapas e seus controles...</p>
                </div>
            `;

        try {
            // 1. Buscar todos os processos da auditoria
            const responseProcessos = await fetch(`/api/processos-por-auditoria?auditoria_id=${auditoriaId}`);
            const dataProcessos = await responseProcessos.json();

            console.log('📦 Processos encontrados:', dataProcessos);

            // 2. Verificar se tem processos
            if (!dataProcessos.success || !dataProcessos.processos || dataProcessos.processos.length === 0) {
                etapasContainer.innerHTML = `
                    <div class="alert-info" style="text-align: center; padding: 40px;">
                        <i class="fas fa-info-circle"></i> Nenhum processo encontrado para esta auditoria.
                    </div>
                `;
                return;
            }

                    for (const etapa of dataEtapas.etapas) {

    // Função para expandir/colapsar processo
    function toggleProcesso(header) {
        const processoCard = header.closest('.processo-card');
        const body = processoCard.querySelector('.processo-body');
        const arrow = header.querySelector('.processo-arrow');

        if (body.style.display === 'none') {
            body.style.display = 'block';
            if (arrow) arrow.classList.add('open');
        } else {
            body.style.display = 'none';
            if (arrow) arrow.classList.remove('open');
        }
    }

    // Função para expandir/colapsar etapa
    function toggleEtapa(header) {
        const etapaCard = header.closest('.etapa-card');
        const body = etapaCard.querySelector('.etapa-body');
        const arrow = header.querySelector('.etapa-arrow');
        const etapaId = etapaCard.getAttribute('data-etapa-id');

        if (body.style.display === 'none') {
            body.style.display = 'block';
            if (arrow) arrow.classList.add('open');

            // Verificar se já carregou os riscos desta etapa
            const riscosContainer = body.querySelector('.riscos-container');
            // Se ainda tem o loading, carregar os riscos
            if (riscosContainer && riscosContainer.innerHTML.includes('Carregando riscos')) {
                carregarRiscosDaEtapa(etapaId);
            }
        } else {
            body.style.display = 'none';
            if (arrow) arrow.classList.remove('open');
        }
    }

    // ====== FUNÇÃO PARA CARREGAR RISCOS DE UMA ETAPA ======
    async function carregarRiscosDaEtapa(etapaId) {
        console.log(`🔍 Buscando riscos da etapa ${etapaId}...`);

        const container = document.getElementById(`riscos-etapa-${etapaId}`);
        if (!container) return;

        try {
            // Buscar os riscos da API
            const response = await fetch(`/api/etapa/${etapaId}/riscos`);
            const data = await response.json();

            console.log(`📦 Riscos encontrados:`, data);

            // Verificar se tem riscos
            if (!data.success || !data.riscos || data.riscos.length === 0) {
                container.innerHTML = `
                    <div class="empty-riscos">
                        <i class="fas fa-info-circle"></i> Nenhum risco cadastrado para esta etapa.
                    </div>
                `;
                return;
            }

            // Montar o HTML dos riscos
            let riscosHtml = '';

            for (const risco of data.riscos) {
                // Calcular a cor do badge baseado na magnitude (score)
                let badgeClass= '';
                let badgeIcon = '';

                if (risco.magnitude <= 3) {
                    badgeClass = 'risco-baixo';
                    badgeIcon = '🟢';
                } else if (risco.magnitude <= 7) {
                    badgeClass = 'risco-medio';
                    badgeIcon = '🟡';
                } else if (risco.magnitude <= 11) {
                    badgeClass = 'risco-alto';
                    badgeIcon = '🟠';
                } else {
                    badgeClass = 'risco-critico';
                    badgeIcon = '🔴';
                }

                riscosHtml += `
                    <div class="risco-card ${badgeClass}" data-risco-id="${risco.id}" data-risco-nome="${escapeHtml(risco.nome_risco)}" onclick="toggleRisco(this, event)">
                        <div class="risco-header">
                            <div class="risco-info">
                                <span class="risco-icon">${badgeIcon}</span>
                                <strong class="risco-nome">${escapeHtml(risco.nome_risco)}</strong>
                                <span class="risco-score">Score: ${risco.magnitude}</span>
                            </div>
                            <div class="risco-actions">
                                <button class="btn-add-controle" onclick="event.stopPropagation(); abrirModalControle(${risco.id}, '${escapeHtml(risco.nome_risco)}', ${etapaId})" title="Adicionar Controle">
                                    <i class="fas fa-plus"></i> Controle
                                </button>
                                <button class="btn-edit-icon" onclick="event.stopPropagation(); editarRiscoEtapa(${risco.id}, ${etapaId})" title="Editar Risco">
                                    <i class="fas fa-pencil-alt"></i>
                                </button>
                                <button class="btn-delete-icon" onclick="event.stopPropagation(); excluirRiscoEtapa(${risco.id}, '${escapeHtml(risco.nome_risco)}', ${etapaId})" title="Excluir Risco">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="risco-detalhes">
                            <div class="risco-detalhe">
                                <span class="detalhe-label">Impacto:</span>
                                <span class="detalhe-valor">${risco.impacto || 'Médio'}</span>
                            </div>
                            <div class="risco-detalhe">
                                <span class="detalhe-label">Probabilidade:</span>
                                <span class="detalhe-valor">${risco.probabilidade || 'Médio'}</span>
                            </div>
                            ${risco.fator_risco ? `
                            <div class="risco-detalhe">
                                <span class="detalhe-label">Fator de Risco:</span>
                                <span class="detalhe-valor">${escapeHtml(risco.fator_risco)}</span>
                            </div>
                            ` : ''}
                            ${risco.consequencia ? `
                            <div class="risco-detalhe">
                                <span class="detalhe-label">Consequência:</span>
                                <span class="detalhe-valor">${escapeHtml(risco.consequencia)}</span>
                            </div>
                            ` : ''}
                            
                            <!-- SEÇÃO DE CONTROLES -->
                            <div class="controles-section">
                                <div class="controles-header">
                                    <span class="controles-titulo"><i class="fas fa-shield-alt"></i> Controles</span>
                                </div>
                                <div class="controles-container" id="controles-risco-${risco.id}">
                                    <div class="loading-small">Carregando controles...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = riscosHtml;

        } catch (error) {
            console.error('❌ Erro ao carregar riscos:', error);
            container.innerHTML = `
                <div class="error-riscos">
                    <i class="fas fa-exclamation-triangle"></i> Erro ao carregar riscos.
                </div>
            `;
        }
    }

            if (!data.success || !data.controles || data.controles.length === 0) {
                container.innerHTML = `
                    <div class="empty-controles">

    // Função para expandir/colapsar detalhes do risco (mostrar/esconder detalhes)
    function toggleRisco(riscoCard, event) {
        // Se o clique foi no botão de editar, excluir ou adicionar controle, NÃO expande o card
        if (event.target.closest('.btn-edit-icon') || 
            event.target.closest('.btn-delete-icon') ||
            event.target.closest('.btn-add-controle')) {
            return;
        }

        // Verificar se o card estava expandido antes de alternar
        const wasExpanded = riscoCard.classList.contains('expandido');

        // Alternar a classe 'expandido'
        riscoCard.classList.toggle('expandido');

        // Se NÃO estava expandido e AGORA está expandindo (primeira vez)
        if (!wasExpanded) {
            // Pegar o ID do risco (guardado no atributo data-risco-id)
            const riscoId = riscoCard.getAttribute('data-risco-id');

            // Procurar o container de controles dentro deste card
            const controlesContainer = riscoCard.querySelector('.controles-container');

            // Verificar se o container existe e ainda tem a mensagem de "Carregando controles..."
            if (controlesContainer && controlesContainer.innerHTML.includes('Carregando controles')) {
                // Chama a função que vai buscar os controles no backend
                carregarControlesDoRisco(riscoId);
            }
        }
    }

    // ====== FUNÇÃO PARA ABRIR MODAL DE CONTROLE ======

    // ====== FUNÇÃO PARA FECHAR O MODAL ======
    function fecharModalControle() {

    // ====== FUNÇÃO PARA SALVAR CONTROLE ======
    async function salvarControle() {
        console.log('💾 Iniciando salvamento do controle...');
        
        // 1. Validar campo obrigatório
        const nomeControle = document.getElementById('controle_nome').value.trim();
        if (!nomeControle) {
           mostrarToast('❌ O nome do controle é obrigatório!', 'error');
           return; 
        }

        // 2. Coletar todos os dados do formulário
        const dados = {
            id: controleIdEditando, // Se for edição, tem o ID; se for novo, é null
            risco_id: riscoIdAtual,
            nome_controle: nomeControle,
            como_executado: document.getElementById('controle_como_executado').value,
            objetivo_controle: document.getElementById('controle_objetivo').value,
            periodicidade_execucao: document.getElementById('controle_periodicidade').value,
            natureza: document.getElementById('controle_natureza').value,
            forma_execucao: document.getElementById('controle_forma_execucao').value,
            status_controle: document.getElementById('controle_status').value,
            evidencia_realizacao: document.getElementById('controle_evidencia').value,
            frequencia_evidencia: document.getElementById('controle_frequencia_evidencia').value,
            responsaveis_tratamento: document.getElementById('controle_responsaveis').value,
            risco_avaliacao: document.getElementById('controle_risco_avaliacao').value,
            causa_motivo: document.getElementById('controle_causa_motivo').value,
            auditoria_id: filtroAuditoriaSelect.value || null
        };

        console.log('📦 Dados a serem enviados:', dados);

        // 3. Enviar para o backend
        try {
            // Mostrar loading no botão
            const btnSalvar = document.getElementById('btn-salvar-modal-controle');
            const textoOriginal = btnSalvar.innerHTML;
            btnSalvar.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Salvando...';
            btnSalvar.disabled = true;

            const response = await fetch('/api/controle-etapa/salvar', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(dados)
            });

            const resultado = await response.json();
            console.log('📬 Resposta do servidor:', resultado);

            if (resultado.success) {
                mostrarToast('✅ Controle salvo com sucesso!', 'success');

                // Fechar o modal
                fecharModalControle();

                // Recarregar os controles do risco
                await carregarControlesDoRisco(riscoIdAtual);

            } else {
                mostrarToast('❌ Erro ao salvar: ' + (resultado.error || 'Tente novamente'), 'error');
            }

            // Restaurar botão
            btnSalvar.innerHTML = textoOriginal;
            btnSalvar.disabled = false;

        } catch (error) {
            console.error('❌ Erro na requisição:', error);
            mostrarToast('❌ Erro de conexão. Tente novamente.', 'error');

            // Restaurar botão
            const btnSalvar = document.getElementById('btn-salvar-modal-controle');
            if (btnSalvar) {
                btnSalvar.innerHTML = '<i class="fas fa-save"></i> Salvar Controle';
                btnSalvar.disabled = false;
            }
        }

    }

    // ====== FUNÇÃO PARA EXCLUIR CONTROLE ======
    async function excluirControle(controleId, nomeControle, riscoId) {
        console.log(`🗑️ Excluir controle ${controleId}: ${nomeControle}`);
        
        // Confirmar com o usuário
        const confirmado = confirm(`Tem certeza que deseja excluir o controle "${nomeControle}"?`);
        
        if (!confirmado) {
            return;  // Usuário cancelou
        }
        
        try {
            // Mostrar loading no botão (opcional)
            mostrarToast('⏳ Excluindo controle...', 'info');
            
            // Chamar a API de exclusão
            const response = await fetch(`/api/controle-etapa/${controleId}`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            });
            
            const resultado = await response.json();
            
            if (resultado.success) {
                mostrarToast('✅ Controle excluído com sucesso!', 'success');
                
                // Recarregar os controles do risco
                await carregarControlesDoRisco(riscoId);
            } else {
                mostrarToast('❌ Erro ao excluir: ' + (resultado.error || 'Tente novamente'), 'error');
            }
            
        } catch (error) {
            console.error('❌ Erro ao excluir controle:', error);
            mostrarToast('❌ Erro de conexão. Tente novamente.', 'error');
        }
    }

    // ====== FUNÇÃO PARA EDITAR CONTROLE ======
    async function editarControle(controleId, riscoId) {
        console.log(`✏️ Editando controle ${controleId} do risco ${riscoId}`);
        
        try {
            // Buscar os dados do controle
            const response = await fetch(`/api/controle-etapa/${controleId}`);
            const data = await response.json();
            
            if (!data.success) {
                mostrarToast('❌ Erro ao carregar dados do controle', 'error');
                return;
            }
            
            const controle = data.controle;
            
            // Guardar o ID do controle que está sendo editado
            controleIdEditando = controleId;
            riscoIdAtual = riscoId;
            
            // Preencher o modal com os dados
            document.getElementById('controle_nome').value = controle.nome_controle;
            document.getElementById('controle_como_executado').value = controle.como_executado;
            document.getElementById('controle_objetivo').value = controle.objetivo_controle;
            document.getElementById('controle_periodicidade').value = controle.periodicidade_execucao;
            document.getElementById('controle_natureza').value = controle.natureza;
            document.getElementById('controle_forma_execucao').value = controle.forma_execucao;
            document.getElementById('controle_status').value = controle.status_controle;
            document.getElementById('controle_evidencia').value = controle.evidencia_realizacao;
            document.getElementById('controle_frequencia_evidencia').value = controle.frequencia_evidencia || '';
            document.getElementById('controle_responsaveis').value = controle.responsaveis_tratamento;
            document.getElementById('controle_risco_avaliacao').value = controle.risco_avaliacao;
            document.getElementById('controle_causa_motivo').value = controle.causa_motivo;
            
            // Buscar o nome do risco para o título
            const riscoCard = document.querySelector(`.risco-card[data-risco-id="${riscoId}"]`);
            const riscoNome = riscoCard ? riscoCard.getAttribute('data-risco-nome') : 'Controle';
            
            // Mudar o título do modal
            const modalTitle = document.getElementById('modal-controle-title');
            if (modalTitle) {
                modalTitle.innerHTML = `<i class="fas fa-shield-alt"></i> Editar Controle - ${riscoNome}`;
            }
            
            // Abrir o modal
            const modal = document.getElementById('modal-controle');
            if (modal) {
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
            
        } catch (error) {
            console.error('❌ Erro ao carregar controle:', error);
            mostrarToast('❌ Erro ao carregar dados do controle', 'error');
        }
    }

    // ====== CONFIGURAR EVENTOS DO MODAL DE CONTROLE ======
    function setupModalControle() {
        // Botão fechar (X)
        const btnFechar = document.getElementById('btn-fechar-modal-controle');
        if (btnFechar) {
            btnFechar.addEventListener('click', fecharModalControle);
        }
        
        // Botão Cancelar
        const btnCancelar = document.getElementById('btn-cancelar-modal-controle');
        if (btnCancelar) {
            btnCancelar.addEventListener('click', fecharModalControle);
        }
        
        // Fechar ao clicar fora do modal (no fundo escuro)
        const modal = document.getElementById('modal-controle');
        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    fecharModalControle();
                }
            });
        }

        // Botão salvar
        const btnSalvar = document.getElementById('btn-salvar-modal-controle');
        if (btnSalvar) {
            btnSalvar.addEventListener('click', salvarControle)
